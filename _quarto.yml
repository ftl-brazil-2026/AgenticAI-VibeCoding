project:
  type: website
  output-dir: docs
  pre-render: python3 scripts/build_calendar.py
  render:
    - "*.qmd"
    - "sessions/*.qmd"
    - "Session_Summaries/*.md"
    - README.md
    - roadmap.md
    - setup.md
    - free-providers.md
  resources:
    - roadmap_cards.html
    - roadmap_cards.js
    - materials/s5-slides.html
    - materials/s5-flashcards.html
    - materials/deck-Alan-Al-Jammoor.pdf
    - materials/agent-step-by-step.html
    - materials/prompt-injection-lab/poisoned.md
    - materials/prompt-injection-lab/poisoned.csv

website:
  title: "Agentic AI Lessons"
  description: "Lessons, roadmap and class materials for the UNV Agentic Software Development & Vibe Coding series."
  navbar:
    search: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Session summaries"
        href: sessions.qmd
      - text: "Roadmap"
        href: roadmap.md
      - text: "Setup"
        href: setup.md
      - text: "Free providers"
        href: free-providers.md

format:
  html:
    theme:
      - journal
      - custom.scss
    toc: true
    toc-depth: 2
    code-copy: true
