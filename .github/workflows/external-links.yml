name: Check external links

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: 1.10.18

      - name: Render and check internal links
        run: quarto render

      - name: Check external links with retries
        id: external-links
        continue-on-error: true
        run: python3 scripts/check_external_links.py --report external-links.json

      - name: Upload the external-link report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: external-link-report
          path: external-links.json
          if-no-files-found: warn
          retention-days: 7

      - name: Fail when broken external links remain
        if: steps.external-links.outcome == 'failure'
        run: exit 1
